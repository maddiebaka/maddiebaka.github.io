name: Deploy site

on:
  push:
    branches: [main]
  # Lets you redeploy by hand from the Actions tab, e.g. after the
  # remote theme changes upstream.
  workflow_dispatch:

# Allow one deploy at a time, and let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          # The default reads .ruby-version, keeping CI on the same Ruby
          # as local. bundler-cache runs bundle install and caches the gems.
          ruby-version: default
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build
        # jekyll-remote-theme fetches mmistakes/minimal-mistakes at build
        # time, so this step needs network access.
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
